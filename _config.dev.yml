# Development build: only the documentation of platform versions 2026.2 and 2026.3.
# Rendering all generated documentation takes minutes; with this override a build takes far less.
# Usage: bundle exec jekyll serve --config _config.yml,_config.dev.yml
#
# Kept: the platform components of 2026.2 and 2026.3 in _data/versions.json, the system types in
# _data/dist/2026.2/versions.json and _data/dist/2026.3/versions.json, and the platform release notes.
# Jekyll's exclude cannot say "all but", so every other version directory is excluded by the shortest prefix
# that no kept version of its type starts with. Where a kept version starts with the whole name (119, 119.2),
# that directory's contents are excluded instead. A version published later is built until it gets a line here.
#
# This list replaces the one in _config.yml rather than adding to it, so that one comes first.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .toolchains/
  - .claude/
  - _tools/
  - pages/docs/auto-webclient/p*
  - pages/docs/auto-webclient/s*
  - pages/docs/auto-webclient/u*
  - pages/docs/auto-webclient/v*
  - pages/docs/auto-webclient/w*
  - pages/docs/auto-webclient/x*
