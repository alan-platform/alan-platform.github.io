# Hugo configuration of alan-platform.com.
#
# The module mounts below map the directories of the repository into Hugo's components, so the paths that other
# tools write to (pages/docs, _data/dist, deps) stay where they are.
# Run hugo from the repository root, where this file is: the mount sources are relative to it.

baseURL = "https://alan-platform.com/"
title = "Alan Platform - Model-Driven Software Development Platform"

# The home page carries no generator meta tag.
disableHugoGeneratorInject = true
# Directory and file names keep their case, so a link to images_IDE keeps working.
disablePathToLower = true
# The site has hand-written navigation and no lists: no section pages, taxonomies or feeds.
disableKinds = ["section", "taxonomy", "term", "RSS"]
enableRobotsTXT = true

# Every page under pages/ is a file with its own name, the address other systems link to: /pages/x/y.html, not
# /pages/x/y/.
# Only that section: the home page stays at /.
[uglyURLs]
  pages = true

[params]
  # The description of a page that has none of its own.
  description = "Alan is a model-driven platform: you write a model of your application, and the platform generates the database, the server, the web application, the authorization and the migrations that go with it."

  # The order of the components in the version tables. Hugo hands the data files over as maps and a range over a
  # map goes in sorted key order, but the tables list the components as the files do: the platform components in the
  # order of the platform object of _data/versions.json, the system types in the order of the system types object
  # of every _data/dist/<version>/versions.json (which agree). A key that a list does not name follows in sorted
  # order, so that nothing is left out (see layouts/partials/ordered-keys.html).
  [params.order]
    platform = ["model", "interface", "project-build-environment"]
    systemTypes = ["auto-webclient", "connector", "datastore", "emailnotifier", "relational-database-bridge", "image-http", "session-manager", "sql-mirror", "webclient", "hosting-server"]

# hugo server answers /docs/archive with docs/archive.html, as GitHub Pages does for an address without .html.
# The site links that address; the page's canonical field only changes its metadata.
[[server.redirects]]
  from = "/docs/archive"
  to = "/docs/archive.html"
  status = 200
  force = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Pages hold raw HTML: the generated documentation carries pre-rendered grammar blocks.
      unsafe = true
      # Void elements are written self-closed: <hr />, <br /> and <img ... />.
      xhtml = true
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
      [markup.goldmark.parser.attribute]
        # {#id .class} after a block or a heading, and the id of the generated grammar blocks and examples.
        block = true
        title = true
    [markup.goldmark.extensions]
      # A bare URL in the text is not turned into a link.
      linkify = false
      # Smart quotes and dashes in prose.
      [markup.goldmark.extensions.typographer]
        disable = false
  [markup.highlight]
    # Fenced code goes through layouts/_markup/render-codeblock.html, which Hugo only calls with codeFences on.
    # The hook writes the wrapper Prism looks for in place of Chroma's markup; Prism highlights in the browser.
    codeFences = true

[module]
  # The build needs this Hugo or newer: an older binary makes Hugo warn, and the output check then fails the build.
  # The standard edition suffices; the stylesheet is plain CSS.
  [module.hugoVersion]
    min = "0.167.0"

  # A component that has mounts of its own gets no default mount. That keeps the repository's assets/
  # directory (fonts, images) out of Hugo's asset pipeline: it is mounted as static content below.

  # Content: the hand-written pages and the generated documentation (pages/docs, written in the form Hugo reads:
  # url and toc in the front matter), the home page placeholder and the text of the 404 page. The 404 text gets a
  # name of its own: a content page at /404 would take the place of Hugo's 404 page, which layouts/404.html
  # renders.
  [[module.mounts]]
    source = "pages"
    target = "content/pages"
    files = ["**/*.md", "*.md"]
  [[module.mounts]]
    source = "index.md"
    target = "content/_index.md"
  [[module.mounts]]
    source = "404.md"
    target = "content/404-text.md"

  # Data: versions.json, navigation.yml and the dist/<platform version>/ files written by CI. Only json, yml and
  # yaml files count as data: Hugo stops the build on a file type it cannot read, and the release script puts
  # RELEASE.md beside the data files.
  [[module.mounts]]
    source = "_data"
    target = "data"
    files = ["**/*.json", "*.json", "**/*.yml", "*.yml", "**/*.yaml", "*.yaml"]

  # Static files, copied as they are: the fonts and images, the dependency graph.
  [[module.mounts]]
    source = "assets"
    target = "static/assets"
  [[module.mounts]]
    source = "deps"
    target = "static/deps"
  [[module.mounts]]
    source = "CNAME"
    target = "static/CNAME"
  [[module.mounts]]
    source = "favicon.ico"
    target = "static/favicon.ico"

  # Assets: the files beside the pages (images, models, snippets of the tutorials), and the scripts and plain
  # stylesheets of src/. layouts/partials/static-payload.html publishes them at their paths in the repository. The
  # parts of the site's stylesheet in src/css/ are not published one by one: layouts/partials/stylesheet.html
  # concatenates them into /src/main.css.
  # They are no static mounts because of hugo server: it maps a changed file to every mount whose source holds it,
  # whatever the mount's files filter, and then keeps one entry per path, whichever component the path is in.
  # pages/about.md was content /pages/about.md and static /pages/about.md; the static entry was kept, and the page
  # was not rendered again. Under payload/ the asset paths differ from the content paths. The file shortcode reads
  # its snippets from there as well, which makes a page follow a change of its snippet.
  [[module.mounts]]
    source = "pages"
    target = "assets/payload/pages"
    files = ["! **/*.md", "! *.md"]
  [[module.mounts]]
    source = "src"
    target = "assets/src"
